<title>Open Language Teacher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;0,6..12,900;1,6..12,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #EDF0F5;
    --card: #FFFFFF;
    --ink: #17203A;
    --navy: #1E2B4D;
    --navy-ink: #FFFFFF;
    --muted: #66708A;
    --faint: #9AA3B8;
    --line: #E3E7EF;
    --blue: #2E63E7;
    --green: #35935B;
    --green-soft: #E2F1E8;
    --coral: #DA6A4C;
    --chip: #F1F4F9;
    --glow: rgba(46, 99, 231, .14);
    --shadow: 0 1px 2px rgba(23,32,58,.04), 0 14px 40px rgba(23,32,58,.08);
    --sans: 'Nunito Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    /* standard node palette — settable per node over MCP */
    --c-blue: #2E63E7; --c-teal: #0F8C86; --c-violet: #7A4FD8;
    --c-coral: #DA6A4C; --c-amber: #B98216; --c-green: #35935B; --c-rose: #C2417C;
    --gridc: color-mix(in srgb, var(--faint) 11%, transparent);
    --gridc-strong: color-mix(in srgb, var(--faint) 18%, transparent);
    --gridc-blue: color-mix(in srgb, var(--blue) 8%, transparent);
    --gridc-sw: color-mix(in srgb, var(--faint) 60%, transparent);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151C; --card: #1B2029; --ink: #E8EBF3;
      --navy: #E8EBF3; --navy-ink: #141A2B;
      --muted: #97A1B8; --faint: #67718C; --line: #2A3140;
      --blue: #7FA3F2; --green: #6FC28F; --green-soft: #1E3226;
      --coral: #E98F72; --chip: #232A38; --glow: rgba(127,163,242,.12);
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 40px rgba(0,0,0,.45);
      --c-blue: #7FA3F2; --c-teal: #5BC8C2; --c-violet: #A98BF0;
      --c-coral: #E98F72; --c-amber: #E3B45C; --c-green: #6FC28F; --c-rose: #E387B4;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151C; --card: #1B2029; --ink: #E8EBF3;
    --navy: #E8EBF3; --navy-ink: #141A2B;
    --muted: #97A1B8; --faint: #67718C; --line: #2A3140;
    --blue: #7FA3F2; --green: #6FC28F; --green-soft: #1E3226;
    --coral: #E98F72; --chip: #232A38; --glow: rgba(127,163,242,.12);
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 14px 40px rgba(0,0,0,.45);
    --c-blue: #7FA3F2; --c-teal: #5BC8C2; --c-violet: #A98BF0;
    --c-coral: #E98F72; --c-amber: #E3B45C; --c-green: #6FC28F; --c-rose: #E387B4;
  }

  * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  *::-webkit-scrollbar { width: 7px; height: 7px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
  *::-webkit-scrollbar-thumb:hover { background: var(--faint); }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.55;
    min-height: 100vh;
    transition: background-color .35s ease, color .35s ease;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: var(--sans); font-size: 14px; cursor: pointer; color: var(--ink); background: none; border: 0; }
  h1 { margin: 0; text-wrap: balance; }

  .mono {
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    letter-spacing: .24em; text-transform: uppercase; color: var(--muted);
  }

  .rv { opacity: 0; }
  .rv-run { animation: rise .55s cubic-bezier(.2,.7,.3,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  /* ---------- topbar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    margin: 14px max(16px, calc((100% - 1060px) / 2)) 0;
    background: var(--card); border-radius: 999px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 6px;
    padding: 8px 10px 8px 18px;
    transition: background-color .35s ease, margin .45s cubic-bezier(.3,.8,.3,1);
  }
  body.panelopen .topbar { margin: 14px 368px 0 16px; }
  .topinfo {
    display: none; align-items: center; gap: 10px; min-width: 0;
    margin-left: 6px; padding-left: 16px; border-left: 1.5px solid var(--line);
  }
  .topinfo.has { display: flex; }
  .topinfo b { font-size: 14.5px; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topinfo .p { color: var(--blue); font-weight: 800; font-size: 13px; white-space: nowrap; flex: none; }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 900; font-size: 15px; white-space: nowrap; margin-right: 10px; }
  .mark { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--blue); display: grid; place-items: center; flex: none; }
  .mark::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
  .topnav { display: flex; gap: 4px; }
  .topnav button {
    padding: 8px 16px; border-radius: 999px; font-weight: 800; font-size: 13.5px; color: var(--muted);
    transition: color .2s, background-color .25s, transform .15s;
  }
  .topnav button:hover { color: var(--ink); transform: translateY(-1px); }
  .topnav button.active { background: var(--navy); color: var(--navy-ink); }
  .spacer { flex: 1; }
  .iconbtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); font-size: 15px; transition: background-color .2s, transform .15s; flex: none; }
  .iconbtn:hover { background: var(--chip); color: var(--ink); transform: translateY(-1px); }
  .aibtn {
    display: inline-flex; align-items: center; gap: 8px; flex: none;
    background: var(--blue); color: #fff;
    font-weight: 800; font-size: 13.5px;
    border-radius: 999px; padding: 9px 18px;
    box-shadow: 0 6px 18px var(--glow);
    transition: transform .15s, box-shadow .2s, filter .2s;
  }
  :root[data-theme="dark"] .aibtn { color: #101828; }
  .aibtn:hover { transform: translateY(-1px); filter: brightness(1.06); box-shadow: 0 10px 26px var(--glow); }
  .aibtn .live { width: 7px; height: 7px; border-radius: 50%; background: #7CF2A4; box-shadow: 0 0 0 0 rgba(124,242,164,.6); animation: ping 2.4s ease-out infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(124,242,164,.55); } 70% { box-shadow: 0 0 0 7px rgba(124,242,164,0); } 100% { box-shadow: 0 0 0 0 rgba(124,242,164,0); } }

  /* ---------- main ---------- */
  main { margin: 0; padding: 0; position: relative; }
  main::before {
    content: ""; position: fixed; top: -180px; left: 50%; width: 720px; height: 480px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, var(--glow), transparent 70%);
    pointer-events: none; z-index: -1;
    animation: drift 22s ease-in-out infinite alternate;
  }
  @keyframes drift { from { transform: translateX(-62%); } to { transform: translateX(-38%); } }

  section[data-view] { display: none; }
  section[data-view].active { display: block; }

  .card {
    background: var(--card); border-radius: 24px; box-shadow: var(--shadow);
    transition: background-color .35s ease;
  }

  /* =========================================================
     NODE FIELDS (skills + plan)
     ========================================================= */
  .sk-head { display: flex; align-items: center; gap: 20px; margin: 12px max(16px, calc((100% - 1060px) / 2)); transition: margin .45s cubic-bezier(.3,.8,.3,1); position: relative; z-index: 10; }
  body.panelopen .sk-head { margin: 12px 368px 12px 16px; }
  .searchpill {
    flex: 1; display: flex; align-items: center; gap: 12px;
    background: var(--card);
    background: color-mix(in srgb, var(--blue) 9%, var(--card));
    border: 1.5px solid color-mix(in srgb, var(--blue) 22%, var(--line));
    border-radius: 999px;
    padding: 4px 8px 4px 20px;
    transition: box-shadow .25s, background-color .35s, border-color .25s;
  }
  .searchpill:focus-within { border-color: var(--blue); box-shadow: 0 0 0 3px var(--glow); }
  .searchpill .glyph { color: var(--faint); font-size: 15px; flex: none; }
  .searchpill input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: none;
    font-family: var(--sans); font-size: 14px; font-weight: 600; color: var(--ink);
    padding: 9px 0;
  }
  .searchpill input::placeholder { color: var(--faint); font-weight: 600; }
  .searchpill .clear {
    width: 32px; height: 32px; border-radius: 50%; color: var(--faint);
    display: none; place-items: center; transition: background-color .2s;
  }
  .searchpill .clear:hover { background: var(--chip); color: var(--ink); }
  .searchpill.hasq .clear { display: grid; }

  .sk-body { position: fixed; inset: 0; z-index: 1; }
  .sk-side {
    position: fixed; top: 14px; right: 14px; bottom: 14px; z-index: 25;
    width: min(324px, calc(100vw - 28px));
    opacity: 0; transform: translateX(18px); pointer-events: none;
    box-shadow: 0 2px 4px rgba(23,32,58,.06), 0 24px 60px rgba(23,32,58,.16);
    transition: opacity .3s ease, transform .45s cubic-bezier(.3,1.2,.4,1), background-color .35s ease;
  }
  .sk-body.withside .sk-side { opacity: 1; transform: none; pointer-events: auto; }

  .mapcanvas {
    position: absolute; inset: 0; overflow: hidden;
    touch-action: none; cursor: grab;
    transition: opacity .3s;
  }
  .mapcanvas[data-bg="dots"] { background-image: radial-gradient(var(--gridc) 1.5px, transparent 1.5px); background-size: 26px 26px; }
  .mapcanvas[data-bg="grid"] { background-image: linear-gradient(var(--gridc) 1px, transparent 1px), linear-gradient(90deg, var(--gridc) 1px, transparent 1px); background-size: 26px 26px; }
  .mapcanvas[data-bg="bigdots"] { background-image: radial-gradient(var(--gridc-strong) 2.5px, transparent 2.5px); background-size: 44px 44px; }
  .mapcanvas[data-bg="hatch"] { background-image: repeating-linear-gradient(45deg, var(--gridc) 0 1px, transparent 1px 24px); }
  .mapcanvas[data-bg="blueprint"] {
    background-color: color-mix(in srgb, var(--blue) 2%, transparent);
    background-image:
      linear-gradient(var(--gridc-blue) 1px, transparent 1px), linear-gradient(90deg, var(--gridc-blue) 1px, transparent 1px),
      linear-gradient(color-mix(in srgb, var(--blue) 14%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, var(--blue) 14%, transparent) 1px, transparent 1px);
    background-size: 26px 26px, 26px 26px, 104px 104px, 104px 104px;
  }
  .mapcanvas[data-bg="plain"] { background-image: none; }

  .bgpick {
    position: absolute; left: 16px; bottom: 12px; z-index: 3;
    display: flex; gap: 6px; padding: 6px;
    background: var(--card); border-radius: 999px; box-shadow: var(--shadow);
  }
  .bgsw {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid var(--line); background-color: var(--bg);
    cursor: pointer; transition: transform .15s, border-color .2s, box-shadow .2s;
  }
  .bgsw:hover { transform: translateY(-1px); }
  .bgsw.on { border-color: var(--blue); box-shadow: 0 0 0 3px var(--glow); }
  .bgsw[data-bg="dots"] { background-image: radial-gradient(var(--gridc-sw) 1px, transparent 1px); background-size: 6px 6px; }
  .bgsw[data-bg="grid"] { background-image: linear-gradient(var(--gridc-sw) 1px, transparent 1px), linear-gradient(90deg, var(--gridc-sw) 1px, transparent 1px); background-size: 7px 7px; }
  .bgsw[data-bg="bigdots"] { background-image: radial-gradient(var(--gridc-sw) 1.5px, transparent 1.5px); background-size: 10px 10px; }
  .bgsw[data-bg="hatch"] { background-image: repeating-linear-gradient(45deg, var(--gridc-sw) 0 1px, transparent 1px 6px); }
  .bgsw[data-bg="blueprint"] { background-color: color-mix(in srgb, var(--blue) 10%, var(--bg)); background-image: linear-gradient(var(--gridc-blue) 1px, transparent 1px), linear-gradient(90deg, var(--gridc-blue) 1px, transparent 1px); background-size: 7px 7px; }
  .mapcanvas.grabbing { cursor: grabbing; }
  .maphint { position: absolute; right: 18px; bottom: 14px; text-align: right; pointer-events: none; letter-spacing: .16em; font-size: 8.5px; color: var(--faint); }
  .maplines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .maplines line, .maplines path { fill: none; stroke: color-mix(in srgb, var(--faint) 50%, transparent); stroke-width: 2; stroke-linecap: round; }
  .maplines .act { stroke: var(--blue); stroke-dasharray: 6 7; animation: dashflow 1.1s linear infinite; }
  .maplines .done { stroke: var(--green); stroke-dasharray: 2 9; stroke-width: 2.5; animation: dashflow 1.8s linear infinite; }
  .maplines .faint { stroke-dasharray: 3 7; opacity: .8; }
  @keyframes dashflow { to { stroke-dashoffset: -26; } }

  .fnode {
    position: absolute; left: 0; top: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: grab; user-select: none; -webkit-user-select: none;
    will-change: transform;
    transition: opacity .35s;
  }
  .fnode:active { cursor: grabbing; }
  .fnode.hid { opacity: 0; pointer-events: none; }
  .nring { position: relative; width: 84px; height: 84px; pointer-events: none; }
  .fnode.child .nring { width: 62px; height: 62px; }
  .nring > svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .nring > svg circle { fill: none; stroke-width: 5; }
  .nring .t { stroke: var(--line); }
  .nring .f {
    stroke: var(--nc, var(--faint)); stroke-linecap: round;
    stroke-dasharray: 163.4; stroke-dashoffset: 163.4;
    transition: stroke-dashoffset 1s cubic-bezier(.3,.8,.3,1), stroke .3s;
  }
  .nico { color: var(--nc, currentColor); }
  .nring b {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    font-size: 14px; font-weight: 900; font-variant-numeric: tabular-nums;
    background: var(--card); border-radius: 50%; margin: 8px;
    box-shadow: var(--shadow);
    transition: background-color .35s, color .3s, box-shadow .3s;
  }
  .fnode.child .nring b { font-size: 11.5px; margin: 7px; }
  .nico { display: block; line-height: 0; }
  .nico svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .fnode.child .nico svg { width: 13px; height: 13px; }
  .nring .pt { line-height: 1.1; }
  .nlabel { font-weight: 800; font-size: 13px; pointer-events: none; white-space: nowrap; }
  .fnode.child .nlabel { font-size: 11.5px; font-weight: 700; color: var(--muted); max-width: 110px; white-space: normal; text-align: center; line-height: 1.2; }
  .nsub { letter-spacing: .14em; font-size: 8px; color: var(--faint); pointer-events: none; white-space: nowrap; }
  .fnode.sel .nring .f, .fnode.open .nring .f { stroke: var(--nc, var(--blue)); }
  .fnode.sel .nring b, .fnode.open .nring b {
    color: var(--nc, var(--blue));
    box-shadow: 0 0 0 6px color-mix(in srgb, var(--nc, var(--blue)) 15%, transparent), var(--shadow);
  }
  .fnode.done-n .nring .f { stroke: var(--green); }
  .fnode.done-n .nring b { color: var(--green); }
  .fnode.done-n .nico { color: inherit; }
  .fnode.ghost .nring b { background: transparent; box-shadow: none; border: 2px dashed var(--faint); color: var(--faint); font-size: 18px; font-weight: 600; }
  .fnode.ghost .nring .t, .fnode.ghost .nring .f { stroke: transparent; }
  .fnode.ghost:hover .nring b { border-color: var(--blue); color: var(--blue); }

  /* ---------- sidebar ---------- */
  .sk-side { overflow: hidden; display: flex; flex-direction: column; }
  .sidecontent { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 24px 22px; display: flex; flex-direction: column; gap: 4px; }
  .sideclose {
    position: absolute; top: 12px; right: 12px; z-index: 3;
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; color: var(--faint); font-size: 13px;
    transition: background-color .2s, color .2s;
  }
  .sideclose:hover { background: var(--chip); color: var(--ink); }
  .sk-side .backlink { color: var(--faint); font-weight: 700; font-size: 12px; text-align: left; padding: 0 0 8px; transition: color .2s; }
  .sk-side .backlink:hover { color: var(--blue); }
  .ptabs { display: flex; gap: 6px; margin: 14px 0 6px; flex: none; }
  .ptabs button {
    padding: 7px 15px; border-radius: 999px; font-weight: 800; font-size: 12.5px;
    color: var(--muted); background: var(--chip);
    transition: background-color .2s, color .2s, transform .15s;
  }
  .ptabs button:hover { color: var(--ink); transform: translateY(-1px); }
  .ptabs button.on { background: var(--navy); color: var(--navy-ink); }
  .sk-side .bigpct { font-size: 44px; font-weight: 900; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
  .sk-side .bigpct small { font-size: 20px; color: var(--faint); font-weight: 800; }
  .sk-side h3 { margin: 0 0 2px; font-size: 20px; font-weight: 900; letter-spacing: -.01em; }
  .sk-side .desc { margin: 8px 0 6px; font-size: 13.5px; color: var(--muted); }
  .sk-side .desc b { color: var(--ink); }
  .sk-side .mono {
    display: block; margin: 18px 0 6px;
    font-family: var(--sans); font-size: 11px; font-weight: 800;
    letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
  }
  .siderows { list-style: none; margin: 0; padding: 0; }
  .siderows li { border-radius: 12px; }
  .siderow {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 10px 10px; border-radius: 12px; font-weight: 700; font-size: 13px;
    transition: background-color .2s, transform .15s;
  }
  .siderow:hover { background: var(--chip); transform: translateX(3px); }
  .siderow .dotc { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .siderow .t { flex: 1; min-width: 0; }
  .siderow .t small { display: block; font-weight: 600; font-size: 11px; color: var(--faint); }
  .siderow .p { font-variant-numeric: tabular-nums; font-weight: 900; color: var(--muted); flex: none; }
  .siderow.ghostrow { color: var(--faint); font-weight: 700; }
  .siderow.ghostrow:hover { color: var(--blue); }
  .sidebar-bar { height: 6px; border-radius: 999px; background: var(--chip); overflow: hidden; margin: 10px 0 4px; flex: none; }
  .sidebar-bar i { display: block; height: 100%; border-radius: 999px; background: var(--blue); width: 0; transition: width 1s cubic-bezier(.3,.8,.3,1); }
  .aitip {
    margin-top: 14px; padding: 12px 14px; border-radius: 14px;
    background: var(--chip); font-size: 12.5px; color: var(--muted); flex: none;
  }
  .aitip b { color: var(--ink); }
  .aitag { font-family: var(--sans); font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); }

  /* step timeline (lesson detail) */
  .steps { list-style: none; margin: 2px 0 0; padding: 0; }
  .steps li { display: flex; gap: 13px; padding: 9px 0; position: relative; }
  .steps li:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 40px; bottom: -4px; width: 2px; background: var(--line); }
  .steps .num {
    width: 27px; height: 27px; border-radius: 50%; flex: none;
    display: grid; place-items: center; position: relative; z-index: 1;
    background: var(--chip); color: var(--blue); font-weight: 800; font-size: 12.5px;
  }
  .steps .st { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 800; line-height: 1.35; padding-top: 3px; }
  .steps .st small { display: block; font-weight: 600; font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .steps .min { font-size: 11.5px; font-weight: 700; color: var(--faint); flex: none; padding-top: 6px; }
  .wchip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 5px 13px;
    font-size: 12.5px; font-weight: 700; margin: 4px 5px 0 0; color: var(--ink);
    cursor: pointer; transition: transform .15s, background-color .2s; }
  .wchip:hover { transform: translateY(-1px); background: var(--blue-soft, var(--chip)); color: var(--blue); }
  .wchip.g { color: var(--green); } .wchip.c { color: var(--coral); }
  .loglines { list-style: none; margin: 4px 0 0; padding: 0; font-size: 12.5px; color: var(--muted); }
  .loglines li { padding: 3px 0 3px 16px; position: relative; }
  .loglines li::before { content: ""; position: absolute; left: 2px; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

  .dots { display: flex; gap: 4px; flex: none; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); transition: background-color .4s; }
  .dots i.f { background: var(--coral); }
  .dots.k i.f { background: var(--green); }

  .wordlist { list-style: none; margin: 0; padding: 0; }
  .wordlist li { border-radius: 12px; transition: background-color .25s; }
  .wordrow {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 10px 10px; border-radius: 12px;

  const SKILL_KEYS = ['vocab', 'grammar', 'speaking', 'listening', 'reading', 'writing'];
  const TOPICS = ['News', 'Slang', 'Conversation', 'Travel', 'Basics', 'Food'];

  const CIRC = 163.4;

  /* Standard icon set — shipped by the app, chosen per node over MCP (icon: "...") */
  const ICONS = {
    book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',

  function iconSvg(name) {
    return ICONS[name] ? '<i class="nico"><svg viewBox="0 0 24 24">' + ICONS[name] + '</svg></i>' : '';
  }

  /* Standard background patterns — pick via the swatch pill on the canvas */
  const BG_META = { dots: [26], grid: [26, 26], bigdots: [44], hatch: [], blueprint: [26, 26, 104, 104], plain: [] };
  let bgName = 'dots';
  function setBg(name) {
    if (!(name in BG_META)) return;
    bgName = name;
    document.querySelectorAll('.mapcanvas').forEach(c => {
      c.dataset.bg = name;
      c.style.backgroundPosition = '';
      c.style.backgroundSize = '';
    });
    document.querySelectorAll('.bgsw').forEach(b => b.classList.toggle('on', b.dataset.bg === name));
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('.bgsw');
    if (b) setBg(b.dataset.bg);
  });
  const TOPIC_ICONS = { News: 'news', Slang: 'tag', Conversation: 'chat', Travel: 'globe', Basics: 'star', Food: 'coffee' };

  let state = deepCopy(DEFAULT);
  let query = '';
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }
  const $ = (id) => document.getElementById(id);

  function setRing(el, pct) {
    const f = el.querySelector('.f');
    if (f) f.style.strokeDashoffset = CIRC * (1 - pct / 100);
  }

  /* ================= node field factory ================= */
  function nodeField(canvas, svg, opts) {
    const f = {
      canvas, svg, nodes: [],
      cam: { x: 0, y: 0 }, tcam: { x: 0, y: 0 }, zoom: 1, tzoom: 1,
      rafId: null
    };

    f.makeNode = function (o) {
      const el = document.createElement('div');
      el.className = 'fnode' + (o.small ? ' child' : '') + (o.ghost ? ' ghost' : '') + (o.cls ? ' ' + o.cls : '');
      el.innerHTML =
        '<span class="nring"><svg viewBox="0 0 60 60">' +
        '<circle class="t" cx="30" cy="30" r="26"></circle>' +
        '<circle class="f" cx="30" cy="30" r="26"></circle></svg>' +
        '<b>' + (o.ghost ? '+' : iconSvg(o.icon) + '<span class="pt">' + (o.text != null ? o.text : o.pct + '%') + '</span>') + '</b></span>' +
        (o.label ? '<span class="nlabel">' + o.label + '</span>' : '') +
        (o.sub ? '<span class="nsub mono">' + o.sub + '</span>' : '');
      canvas.appendChild(el);
      const x = o.px / 100 * canvas.clientWidth, y = o.py / 100 * canvas.clientHeight;
      const n = Object.assign({}, o, {
        el,
        bx: o.fromX != null ? o.fromX : x, by: o.fromY != null ? o.fromY : y,
        s: 0.01, ts: 1,
        amp: o.small ? 5 : 8,
        sp: 0.06 + Math.random() * 0.06, ph: Math.random() * 6.28,
        dead: false
      });
      setRing(el, o.ghost ? 0 : (o.pct || 0));
      if (o.color) el.style.setProperty('--nc', 'var(--c-' + o.color + ')');
      attach(n);
      f.nodes.push(n);
      return n;
    };

    f.clear = function () { f.nodes.forEach(n => n.el.remove()); f.nodes = []; };

    f.removeDead = function (delay) {
      setTimeout(() => {
        f.nodes.filter(n => n.dead).forEach(n => n.el.remove());
        f.nodes = f.nodes.filter(n => !n.dead);
      }, delay || 500);
    };

    function attach(n) {
      let sx, sy, moved;
      n.el.addEventListener('pointerdown', e => {
        e.preventDefault();
        e.stopPropagation();
        sx = e.clientX; sy = e.clientY; moved = false;
        const move = ev => {
          if (Math.hypot(ev.clientX - sx, ev.clientY - sy) > 6) moved = true;
          if (!moved) return;
          const r = canvas.getBoundingClientRect();
          const wx = (ev.clientX - r.left - f.cam.x) / f.zoom;
          const wy = (ev.clientY - r.top - f.cam.y) / f.zoom;
          n.px = Math.max(4, Math.min(96, wx / r.width * 100));
          n.py = Math.max(6, Math.min(94, wy / r.height * 100));
        };
        const up = () => {
          window.removeEventListener('pointermove', move);
          window.removeEventListener('pointerup', up);
          if (!moved && opts.onClick) opts.onClick(n);
        };
        window.addEventListener('pointermove', move);
        window.addEventListener('pointerup', up);
      });
    }

    canvas.addEventListener('pointerdown', e => {
      if (e.target.closest('.fnode') || e.target.closest('.bgpick')) return;
      const sx = e.clientX, sy = e.clientY, cx0 = f.tcam.x, cy0 = f.tcam.y;
      let moved = false;
      canvas.classList.add('grabbing');
      const move = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        if (Math.hypot(dx, dy) > 6) moved = true;
        if (moved) { f.tcam.x = cx0 + dx; f.tcam.y = cy0 + dy; }
      };
      const up = () => {
        window.removeEventListener('pointermove', move);
        window.removeEventListener('pointerup', up);
        canvas.classList.remove('grabbing');
        if (!moved && opts.onBgClick) opts.onBgClick();
      };
      window.addEventListener('pointermove', move);
      window.addEventListener('pointerup', up);
    });

    canvas.addEventListener('wheel', e => {
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      const nz = Math.max(0.45, Math.min(2.4, f.tzoom * Math.exp(-e.deltaY * 0.0012)));
      const wx = (mx - f.tcam.x) / f.tzoom, wy = (my - f.tcam.y) / f.tzoom;
      f.tcam.x = mx - wx * nz;
      f.tcam.y = my - wy * nz;
      f.tzoom = nz;
    }, { passive: false });

    canvas.addEventListener('dblclick', () => { f.tcam.x = 0; f.tcam.y = 0; f.tzoom = 1; });

    function updateLines() {
      const lines = opts.getLines ? opts.getLines(f) : [];
      if (!lines.length) { svg.innerHTML = ''; return; }
      svg.setAttribute('viewBox', '0 0 ' + canvas.clientWidth + ' ' + canvas.clientHeight);
      svg.innerHTML = lines.map(l => {
        if (l.wave) {
          const dx = l.x2 - l.x1, dy = l.y2 - l.y1;
          const len = Math.hypot(dx, dy) || 1;
          const w = l.wave * Math.min(38, len * 0.28) * f.zoom;
          const px = -dy / len * w, py = dx / len * w;
          const c1x = l.x1 + dx * 0.32 + px, c1y = l.y1 + dy * 0.32 + py;
          const c2x = l.x2 - dx * 0.32 - px, c2y = l.y2 - dy * 0.32 - py;
          return '<path class="' + (l.cls || '') + '" d="M ' + l.x1 + ' ' + l.y1 + ' C ' + c1x + ' ' + c1y + ', ' + c2x + ' ' + c2y + ', ' + l.x2 + ' ' + l.y2 + '"></path>';
        }
        return '<line class="' + (l.cls || '') + '" x1="' + l.x1 + '" y1="' + l.y1 + '" x2="' + l.x2 + '" y2="' + l.y2 + '"></line>';
      }).join('');
    }

    function tick(t) {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      f.cam.x += (f.tcam.x - f.cam.x) * 0.14;
      f.cam.y += (f.tcam.y - f.cam.y) * 0.14;
      f.zoom += (f.tzoom - f.zoom) * 0.14;
      const meta = BG_META[bgName] || [];
      if (meta.length) {
        canvas.style.backgroundPosition = f.cam.x + 'px ' + f.cam.y + 'px';
        canvas.style.backgroundSize = meta.map(s => (s * f.zoom) + 'px ' + (s * f.zoom) + 'px').join(', ');
      } else if (bgName === 'hatch') {
        canvas.style.backgroundPosition = f.cam.x + 'px ' + f.cam.y + 'px';
      }
      f.nodes.forEach(n => {
        const tx = n.px / 100 * w, ty = n.py / 100 * h;
        n.bx += (tx - n.bx) * 0.085;
        n.by += (ty - n.by) * 0.085;
        n.s += (n.ts - n.s) * 0.12;
        const fx = reduced ? 0 : Math.sin(t / 1000 * n.sp + n.ph) * n.amp * n.s;
        const fy = reduced ? 0 : Math.cos(t / 1000 * n.sp * 0.83 + n.ph * 1.3) * n.amp * n.s;
        n.rx = (n.bx + fx) * f.zoom + f.cam.x;
        n.ry = (n.by + fy) * f.zoom + f.cam.y;
        n.el.style.transform = 'translate(' + n.rx + 'px,' + n.ry + 'px) translate(-50%,-50%) scale(' + (Math.max(0.01, n.s) * f.zoom) + ')';
      });
      updateLines();
      f.rafId = requestAnimationFrame(tick);
    }
    f.start = function () {
      if (f.rafId != null) return;
      const w = canvas.clientWidth, h = canvas.clientHeight;
      f.nodes.forEach(n => { if (n.bx === 0 && n.by === 0) { n.bx = n.px / 100 * w; n.by = n.py / 100 * h; } });
      f.rafId = requestAnimationFrame(tick);
    };
    f.stop = function () { if (f.rafId != null) { cancelAnimationFrame(f.rafId); f.rafId = null; } };
    return f;
  }

  function visibleCenterX(field) {
    const w = field.canvas.clientWidth || window.innerWidth;
    return Math.max(28, Math.min(50, ((w - 352) / 2) / w * 100));
  }

  function bloom(field, parent, kids, mkOpts, cx, cy) {
    cx = cx != null ? cx : 50; cy = cy != null ? cy : 46;
    const rx = Math.min(30, cx - 6), ry = 30;
    const total = kids.length;
    kids.forEach((c, i) => {
      const a = -Math.PI / 2 + i * (2 * Math.PI / total);
      const px = Math.max(6, Math.min(94, cx + Math.cos(a) * rx));
      const py = Math.max(10, Math.min(88, cy + Math.sin(a) * ry));
      field.makeNode(Object.assign({ px, py, fromX: parent.bx, fromY: parent.by, small: true }, mkOpts(c, i)));
    });
  }

  /* ================= derived data ================= */
  function allWords() {
    return state.learning.map(w => ({ w, k: false })).concat(state.known.map(w => ({ w, k: true })));
  }
  function topicStats(t) {
    const ws = allWords().filter(x => x.w.topic === t);
    const m = ws.filter(x => x.k).length;
    return { total: ws.length, mastered: m, pct: ws.length ? Math.round(m / ws.length * 100) : 0, words: ws };
  }
  function childrenOf(k) {
    const sk = state.skills[k];
    if (k === 'vocab') return TOPICS.map(t => { const s = topicStats(t); return { name: t, pct: s.pct, note: s.total + ' pieces · ' + s.mastered + ' mastered', type: 'topic', icon: TOPIC_ICONS[t] }; });
    if (k === 'grammar') return (sk.concepts || []).map(c => ({ name: c.name, pct: Math.round(c.s / 3 * 100), note: c.s === 3 ? 'solid' : c.s === 0 ? 'not started' : 'in progress', type: 'concept', ex: c.ex, s: c.s }));
    return (sk.subs || []).map(s => ({ name: s.name, pct: s.pct, note: s.note, type: 'metric' }));
  }
  function hubPct() {
    return Math.round(SKILL_KEYS.reduce((a, k) => a + state.skills[k].pct, 0) / SKILL_KEYS.length);
  }
  function nodeSub(k) {
    if (k === 'vocab') return (state.known.length + state.knownExtra) + ' mastered';
    if (k === 'grammar') {
      const c = state.skills.grammar.concepts || [];
      return c.length ? c.filter(x => x.s === 3).length + '/' + c.length + ' solid' : '—';
    }
    return state.skills[k].meta || '—';
  }
  function curPlan() { return state.plans.find(p => p.status === 'current'); }
  function nextLesson() { const p = curPlan(); return p ? p.lessons.find(l => !l.done) : null; }
  function planPct(p) { return p.lessons && p.lessons.length ? Math.round(p.lessons.filter(l => l.done).length / p.lessons.length * 100) : 0; }

  /* ================= SKILLS field ================= */
  let skExpanded = null, skChild = null;

  const SK = nodeField($('skillMap'), $('skillLines'), {
    onClick: n => {
      if (n.kind === 'skill') { skExpanded === n.key ? skCollapse() : skExpand(n.key); }
      else skSelect(n.idx);
    },
    onBgClick: () => { if (skExpanded) skCollapse(); },
    getLines: f => {
      if (!skExpanded) return [];
      const parent = f.nodes.find(n => n.kind === 'skill' && n.key === skExpanded);
      if (!parent) return [];
      return f.nodes.filter(n => n.kind !== 'skill' && !n.dead).map(n => ({
        x1: parent.rx || parent.bx, y1: parent.ry || parent.by,
        x2: n.rx || n.bx, y2: n.ry || n.by,
        cls: n.idx === skChild ? 'act' : ''
      }));
    }
  });

  function skBuild() {
    SK.clear();
    skExpanded = null; skChild = null;
    SKILL_KEYS.forEach((k, i) => {
      const sk = state.skills[k];
      const n = SK.makeNode({ kind: 'skill', key: k, px: sk.pos[0], py: sk.pos[1], pct: sk.pct, icon: sk.icon, color: sk.color, label: sk.label, sub: nodeSub(k) });
      if (!reduced) { n.s = 0; n.ts = 0; setTimeout(() => { n.ts = 1; }, 80 * i); }
    });
  }

  function skExpand(k) {
    skCollapse(false);
    skExpanded = k; skChild = null;
    const parent = SK.nodes.find(n => n.kind === 'skill' && n.key === k);
    const cx = visibleCenterX(SK);
    SK.nodes.forEach(n => {
      if (n.kind !== 'skill') return;
      if (n.key === k) { n.px = cx; n.py = 46; n.ts = 1.12; n.el.classList.add('open'); n.el.classList.remove('hid'); }
      else { n.ts = 0; n.el.classList.add('hid'); n.el.classList.remove('open'); }
    });
    const kids = childrenOf(k).map((c, i) => ({ c, i }));
    kids.push({ ghost: true, i: kids.length });
    bloom(SK, parent, kids, (o) => o.ghost
      ? { kind: 'ghost', key: 'ghost', idx: o.i, ghost: true }
      : { kind: 'child', key: k, idx: o.i, pct: o.c.pct, icon: o.c.icon, color: state.skills[k].color, label: o.c.name }, cx, 46);
    renderSkillSide();
  }

  function skCollapse(rerender) {
    const home = skExpanded ? state.skills[skExpanded].pos : null;
    SK.nodes.filter(n => n.kind !== 'skill').forEach(n => {
      n.dead = true; n.ts = 0;
      if (home) { n.px = home[0]; n.py = home[1]; }
      n.el.classList.add('hid');
    });
    SK.removeDead();
    SK.nodes.filter(n => n.kind === 'skill').forEach(n => {
      const sk = state.skills[n.key];
      n.px = sk.pos[0]; n.py = sk.pos[1]; n.ts = 1;
      n.el.classList.remove('hid', 'open', 'sel');
    });
    skExpanded = null; skChild = null;
    if (rerender !== false) renderSkillSide();
  }

  function skSelect(i) {
    skChild = i;
    SK.nodes.forEach(n => n.el.classList.toggle('sel', n.kind !== 'skill' && n.idx === i));
    renderSkillSide();
  }

  function skRefresh() {
    SK.nodes.forEach(n => {
      if (n.kind === 'skill') {
        const sk = state.skills[n.key];
        const pt = n.el.querySelector('.nring .pt'); if (pt) pt.textContent = sk.pct + '%';
        const subEl = n.el.querySelector('.nsub'); if (subEl) subEl.textContent = nodeSub(n.key);
        setRing(n.el, sk.pct);
      } else if (n.kind === 'child' && skExpanded) {
        const c = childrenOf(skExpanded)[n.idx];
        const pt = n.el.querySelector('.nring .pt');
        if (c && pt) { pt.textContent = c.pct + '%'; setRing(n.el, c.pct); }
      }
    });
  }

  /* ================= PLAN field ================= */
  let plWeek = null, plSel = null, plTab = 'agenda';

  const PL = nodeField($('planMap'), $('planLines'), {
    onClick: n => {
      if (n.kind === 'week') {
        const p = state.plans.find(x => x.id === n.key);
        if (p.status === 'future') { plWeek === n.key ? plCollapse() : plSelectFuture(n); }
        else plWeek === n.key ? plCollapse() : plExpand(n.key);
      } else if (n.kind === 'day') plSelect(n.idx);
    },
    onBgClick: () => { if (plWeek) plCollapse(); },
    getLines: f => {
      const out = [];
      const ws = f.nodes.filter(n => n.kind === 'week' && !n.dead);
      for (let i = 0; i < ws.length - 1; i++) out.push({
        x1: ws[i].rx || ws[i].bx, y1: ws[i].ry || ws[i].by,
        x2: ws[i + 1].rx || ws[i + 1].bx, y2: ws[i + 1].ry || ws[i + 1].by,
        cls: 'faint', wave: i % 2 ? -0.5 : 0.5
      });
      const p = plWeek ? state.plans.find(x => x.id === plWeek && x.status !== 'future') : null;
      if (p) {
        const parent = ws.find(n => n.key === plWeek);
        if (parent) {
          const days = f.nodes.filter(n => n.kind === 'day' && !n.dead).sort((a, b) => a.idx - b.idx);
          const pts = [parent].concat(days);
          const next = p.status === 'current' ? p.lessons.find(x => !x.done) : null;
          for (let i = 0; i < pts.length - 1; i++) {
            const l = p.lessons[pts[i + 1].idx];
            let cls = '';
            if (l && l.done) cls = 'done';
            if (l && next && l.n === next.n) cls = 'act';
            if (typeof plSel === 'number' && pts[i + 1].idx === plSel) cls = 'act';
            out.push({
              x1: pts[i].rx || pts[i].bx, y1: pts[i].ry || pts[i].by,
              x2: pts[i + 1].rx || pts[i + 1].bx, y2: pts[i + 1].ry || pts[i + 1].by,
              cls, wave: i % 2 ? -1 : 1
            });
          }
        }
      }
      return out;
    }
  });

  function weekNodeOpts(p) {
    if (p.status === 'future') return { kind: 'week', key: p.id, px: p.pos[0], py: p.pos[1], ghost: true, label: p.title + ' · next', sub: p.range };
    const pct = planPct(p);
    return {
      kind: 'week', key: p.id, px: p.pos[0], py: p.pos[1], pct,
      text: p.status === 'past' ? '✓' : p.lessons.filter(l => l.done).length + '/' + p.lessons.length,
      label: p.title + (p.status === 'current' ? ' · now' : ''),
      sub: p.focus, cls: p.status === 'past' ? 'done-n' : ''
    };
  }

  function plBuild() {
    PL.clear();
    plWeek = null; plSel = null;
    if (!state.plans.length) {
      PL.makeNode({ kind: 'none', key: 'none', px: 50, py: 46, ghost: true, label: 'No plan yet', sub: 'onboarding writes the first one' });
      return;
    }
    state.plans.forEach((p, i) => {
      const n = PL.makeNode(weekNodeOpts(p));
      if (p.status === 'past') setRing(n.el, 100);
      if (!reduced) { n.s = 0; n.ts = 0; setTimeout(() => { n.ts = 1; }, 90 * i); }
    });
  }

  function plExpand(id) {
    plCollapse(false);
    plWeek = id; plSel = 'week';
    const p = state.plans.find(x => x.id === id);
    const parent = PL.nodes.find(n => n.kind === 'week' && n.key === id);
    PL.nodes.forEach(n => {
      if (n.kind !== 'week') return;
      n.el.classList.toggle('open', n.key === id);
    });
    const next = p.status === 'current' ? p.lessons.find(l => !l.done) : null;
    const w = PL.canvas.clientWidth || window.innerWidth;
    const rightEdge = Math.max(60, Math.min(90, ((w - 380) / w) * 100));
    const step = (rightEdge - 24) / Math.max(1, p.lessons.length - 1);
    p.lessons.forEach((l, i) => {
      PL.makeNode({
        kind: 'day', key: id, idx: i, small: true,
        px: 24 + i * step, py: p.pos[1],
        fromX: parent.bx, fromY: parent.by,
        pct: l.done ? 100 : 0,
        text: l.done ? '✓' : l.n,
        icon: l.icon, color: l.color,
        label: l.title,
        sub: 'day ' + l.n + ' · ' + l.mins + ' min',
        cls: next && l.n === next.n ? 'sel' : ''
      });
    });
    renderPlanSide();
  }

  function plCollapse(rerender) {
    const p = plWeek ? state.plans.find(x => x.id === plWeek) : null;
    PL.nodes.filter(n => n.kind === 'day').forEach(n => {
      n.dead = true; n.ts = 0;
      if (p) { n.px = p.pos[0]; n.py = p.pos[1]; }
      n.el.classList.add('hid');
    });
    PL.removeDead();
    PL.nodes.filter(n => n.kind === 'week' || n.kind === 'none').forEach(n => {
      n.ts = 1;
      n.el.classList.remove('hid', 'open', 'sel');
    });
    plWeek = null; plSel = null;
    if (rerender !== false) renderPlanSide();
  }

  function plSelectFuture(n) {
    plWeek = n.key; plSel = 'week';
    PL.nodes.forEach(x => x.el.classList.toggle('sel', x === n));
    renderPlanSide();
  }

  function plSelect(i) {
    plSel = i; plTab = 'agenda';
    PL.nodes.forEach(n => n.el.classList.toggle('sel', n.kind === 'day' && n.idx === i));
    renderPlanSide();
  }

  /* ================= sidebars ================= */
  function dotsHtml(p, k) {
    let h = '<span class="dots' + (k ? ' k' : '') + '">';
    for (let i = 1; i <= 3; i++) h += '<i class="' + (i <= p ? 'f' : '') + '"></i>';
    return h + '</span>';
  }

    return '<li data-word="' + w.es + '"><button class="wordrow">' +
      '<span class="headword">' + w.es + '</span>' +
      '<span class="gloss">' + w.en + '</span>' +
      (tag ? '<span class="wtag">' + tag + '</span>' : '') +
      dotsHtml(w.p, known) + '</button>' +
      '<div class="ex"><div><p><span class="es">' + w.ex + '</span></p></div></div></li>';
  }
  function bar(pct) { return '<div class="sidebar-bar"><i data-w="' + pct + '"></i></div>'; }

    root.querySelectorAll('.sidebar-bar i').forEach(el => {

  /* ---- topbar info + layout chrome ---- */
  function updateChrome() {
    const view = document.querySelector('section.active').dataset.view;
    let open = false, info = '';
    if (view === 'skills') {
      open = !!skExpanded || !!query;
      if (query) {
        info = '<b>Search</b><span class="p">&ldquo;' + query + '&rdquo;</span>';
      } else if (skExpanded) {
        const kids = childrenOf(skExpanded);
        if (skChild != null && kids[skChild]) info = '<b>' + kids[skChild].name + '</b><span class="p">' + kids[skChild].pct + '%</span>';
        else if (skChild === kids.length) info = '<b>New subtopic</b>';
        else info = '<b>' + state.skills[skExpanded].label + '</b><span class="p">' + state.skills[skExpanded].pct + '%</span>';
      }
    } else {
      open = plSel != null && !!plWeek;

    const box = $('skillSideContent');

        '<div class="aitip">Just say it in voice mode: <b>&ldquo;Add a football vocabulary pack&rdquo;</b> or <b>&ldquo;start grading my past tense&rdquo;</b> — a node appears on this map via <b>add_subtopics</b>, with an icon and a color your AI picks from the app&rsquo;s standard sets (book, mic, globe, tag… · blue, teal, violet, coral, amber, rose).</div>';

          '</ul>' +
          '<div class="aitip">Want more? Say <b>&ldquo;teach me five more ' + c.name.toLowerCase() + ' words&rdquo;</b> in your next lesson.</div>';

          '<div class="aitip">Graded like vocabulary: three solid recalls in real sentences and it turns green.</div>';

      '<p class="desc" style="margin-top:10px; padding-right:24px">' + sk.desc + '</p>' +

      '<ul class="siderows">' + kids.map((c, i) =>
        '<li data-child="' + i + '"><button class="siderow"><span class="dotc" style="background:' + (c.pct >= 80 ? 'var(--green)' : c.pct > 0 ? 'var(--coral)' : 'var(--faint)') + '"></span><span class="t">' + c.name + '<small>' + c.note + '</small></span><span class="p">' + c.pct + '%</span></button></li>').join('') +
        '<li data-child="ghost"><button class="siderow ghostrow"><span class="dotc" style="background:transparent; border:1.5px dashed var(--faint)"></span><span class="t">Ask your AI for a new subtopic</span></button></li>' +
      '</ul>';
  }

  $('skillSide').addEventListener('click', e => {
    const back = e.target.closest('[data-back]');
    if (back) { back.dataset.back === 'all' ? skCollapse() : (skChild = null, SK.nodes.forEach(n => n.el.classList.remove('sel')), renderSkillSide()); return; }
    const ch = e.target.closest('li[data-child]');

    const go = e.target.closest('li[data-goto]');

  $('searchClear').addEventListener('click', () => {

  /* ---- plan sidebar ---- */
  function stepRows(l) {
    return '<ul class="steps">' + l.steps.map((s, i) =>
      '<li><span class="num">' + (i + 1) + '</span>' +
      '<span class="st">' + s.name + '<small>' + (KINDS[s.k] || s.k) + (s.d ? ' — ' + s.d : '') + '</small></span>' +

  function renderPlanSide() {
    const box = $('planSideContent');
    $('planBody').classList.toggle('withside', plSel != null);
    updateChrome();
    if (plSel == null || !plWeek) { box.innerHTML = ''; return; }

    const p = state.plans.find(x => x.id === plWeek);

    if (p.status === 'future') {
      box.innerHTML =
        '<p class="desc" style="margin-top:10px; padding-right:24px">Plans are <b>always short-term</b> — one week, then iterate. Your AI writes this one on Sunday, in lesson 5 of week 34, after reviewing what stuck and what didn’t.</p>' +
        '<p class="desc">Likely focus, based on this week’s notes: <b>pretérito</b>, more news pieces, and “encuesta” until it behaves.</p>' +
        '<div class="aitip">Impatient? Say <b>&ldquo;plan next week now&rdquo;</b> in voice mode — it calls <b>create_plan</b> whenever you ask.</div>';
      return;
    }

    if (typeof plSel === 'number' && p.lessons[plSel]) {
      const l = p.lessons[plSel];

        body = stepRows(l) +
          (l.log ? '<span class="mono">Session log</span><ul class="loglines">' + l.log.map(x => '<li>' + x + '</li>').join('') + '</ul>' : '') +
          (l.note ? '<div class="aitip"><b>AI note:</b> ' + l.note + '</div>' : '') +

      '<ul class="siderows">' + p.lessons.map((l, i) => {
        const isNext = p.status === 'current' && nextLesson() && nextLesson().n === l.n;
        return '<li data-lesson="' + i + '"><button class="siderow"><span class="dotc" style="background:var(--c-' + (l.color || 'blue') + ')' + (l.done || isNext ? '' : '; opacity:.4') + '"></span><span class="t">' + l.title + '<small>day ' + l.n + ' · ' + l.mins + ' min' + (l.done ? ' · done' : isNext ? ' · today' : '') + '</small></span></button></li>';
      }).join('') + '</ul>' +
      '<div class="aitip"><b>Plans stay short — always.</b> One week, then your AI reviews what stuck and writes the next. No grand curricula.</div>';
  }

  function switchView(name) {

    if (btn) btn.click();
  }
  function gotoWordNode(es) {
    const hit = allWords().find(x => x.w.es === es);

    skExpand('vocab');
    if (hit) { const ti = TOPICS.indexOf(hit.w.topic); if (ti >= 0) skSelect(ti); }

    skExpand('grammar');

    const gg = e.target.closest('[data-gogram]');

    el.classList.remove('flash');

    el.classList.add('flash');

    if (reduced) { section.querySelectorAll('.rv').forEach(el => el.classList.add('rv-run')); return; }
    section.querySelectorAll('.rv').forEach((el, i) => {
      el.classList.remove('rv-run');

  /* ================= AI panel ================= */
  const panel = $('aiPanel');

  let timers = [];

  function openAI() { panel.classList.add('open'); }
  function closeAI() { panel.classList.remove('open'); }
  $('aiOpen').addEventListener('click', () => panel.classList.contains('open') ? closeAI() : openAI());

  function addBubble(kind, html) {
    const div = document.createElement('div');
    if (kind === 'sys') { div.className = 'sysline'; div.innerHTML = html; }
    else if (kind === 'tool') { div.className = 'toolcall'; div.innerHTML = html; }
    else {
      div.className = 'bub ' + (kind === 'ai' ? 'ai-b' : 'user');
      div.innerHTML = '<span class="who">' + (kind === 'ai' ? 'ChatGPT' : 'You') + '</span>' + html;
    }
    transcript.appendChild(div);
    transcript.scrollTop = transcript.scrollHeight;
  }

  function setSpeaking(who) {
    panel.classList.toggle('speak-ai', who === 'ai');
    panel.classList.toggle('speak-user', who === 'user');
    $('voiceLabel').textContent = who === 'ai' ? 'AI speaking' : (who === 'user' ? 'Listening to you' : 'Idle');
  }

  function runScenario(events, prep) {
    if (playing) return;
    playing = true;
    $('playOnboard').disabled = true;
    $('playLesson').disabled = true;
    transcript.innerHTML = '';
    if (prep) { prep(); renderAll(); }
    let t = 400;
    events.forEach(ev => {
      timers.push(setTimeout(() => {
        if (ev.t === 'tool') {
          addBubble('tool',
            '⚙ <span class="tn">' + ev.name + '</span>' +
            (ev.args ? '\n<span class="args">' + ev.args + '</span>' : '') +
            (ev.fx ? '\n<span class="fx">→ ' + ev.fx + '</span>' : ''));
          setSpeaking(null);
        } else if (ev.t === 'sys') {
          addBubble('sys', ev.text);
          setSpeaking(null);
        } else {
          addBubble(ev.t, ev.text);
          setSpeaking(ev.t);
        }
        if (ev.run) ev.run();
      }, t));
      t += ev.d || 1900;
    });
    timers.push(setTimeout(() => {
      setSpeaking(null);
      playing = false;
      $('playOnboard').disabled = false;
      $('playLesson').disabled = false;
    }, t + 300));
  }

  function resetSim() {
    timers.forEach(clearTimeout); timers = [];
    playing = false;
    $('playOnboard').disabled = false;
    $('playLesson').disabled = false;
    setSpeaking(null);
    state = deepCopy(DEFAULT);
    renderAll();
    transcript.innerHTML = '<div class="sysline">RESET · PLAY A JOURNEY ABOVE</div>';
  }
  $('simReset').addEventListener('click', resetSim);

  /* ------- scenario: onboarding ------- */
  function zeroSkills() {
    const sk = deepCopy(DEFAULT.skills);
    Object.keys(sk).forEach(k => {
      sk[k].pct = 0;
      if (sk[k].concepts) sk[k].concepts = [];
      if (sk[k].subs) sk[k].subs.forEach(s => s.pct = 0);
      if (sk[k].meta) sk[k].meta = '—';
    });
    return sk;
  }
  function freshPlans() {
    const w34 = deepCopy(DEFAULT.plans.find(p => p.id === 'w34'));
    w34.lessons.forEach(l => { l.done = false; delete l.log; });
    w34.pos = [13, 30];
    const w35 = deepCopy(DEFAULT.plans.find(p => p.id === 'w35'));
    w35.pos = [13, 62];
    return [w34, w35];
  }

  const onboardingEvents = [
    { t: 'sys',  text: 'VOICE MODE · NEW PROFILE, NOTHING LINKED YET', d: 1600 },
    { t: 'user', text: '&ldquo;Link my Open Language Teacher profile — code OLT-4F2K.&rdquo;', d: 2000 },
    { t: 'tool', name: 'link_profile', args: '{ code: "OLT-4F2K" }', fx: 'connected', d: 2000 },
    { t: 'ai',   text: 'Linked! A brand-new Spanish profile. Roughly how many Spanish words would you say you already know?', d: 2600 },
    { t: 'user', text: '&ldquo;Maybe two hundred? I can order food and greet people.&rdquo;', d: 2200 },
    { t: 'ai',   text: 'A solid A2 base. And what do you want Spanish <em>for</em> — conversations, reading, travel, the news?', d: 2600 },
    { t: 'user', text: '&ldquo;Conversations mostly. And Spanish news… and real slang, not textbook stuff.&rdquo;', d: 2600 },
    { t: 'tool', name: 'update_profile', args: '{ level: "A2", known_words: ~200,\n  goals: ["conversation", "news", "slang"] }', fx: 'profile saved · skill map estimated',
      run: () => {
        state.knownExtra = 200;
        state.skills = deepCopy(DEFAULT.skills);
        skBuild(); renderSkillSide();
      }, d: 2200 },
    { t: 'tool', name: 'get_plan_instructions', args: 'reads olt://guide/lesson-authoring', d: 2000 },
    { t: 'ai',   text: 'The app asks me to keep plans short — one week, then iterate. Five ±15-minute lessons around news, slang and conversation. Sound good?', d: 3000 },
    { t: 'user', text: '&ldquo;Perfect.&rdquo;', d: 1400 },
    { t: 'tool', name: 'create_plan', args: '{ days: 7, lessons: 5,\n  focus: ["news", "slang", "conversation"] }', fx: 'plan written — check the Plan tab',
      run: () => { state.plans = freshPlans(); plBuild(); renderPlanSide(); }, d: 2400 },
    { t: 'tool', name: 'add_subtopics', args: '{ vocabulary: ["News", "Slang"],\n  grammar: ["pretérito", "por vs para"],\n  words: ["la noticia", "el titular", …12] }', fx: 'new nodes on your map',
      run: () => {
        state.learning = deepCopy(DEFAULT.learning).map(w => (w.p = 0, w));
        skBuild(); renderSkillSide(); flashSkill('vocab');
      }, d: 2400 },
    { t: 'ai',   text: 'Done — your week is waiting in the app. Say <em>&ldquo;start my lesson&rdquo;</em> whenever you&rsquo;re ready. ¡Hasta pronto!', d: 2400 },
    { t: 'sys',  text: 'ONBOARDING COMPLETE — THE MAPS FILLED THEMSELVES IN', d: 1200 }
  ];

  function playOnboard() {
    runScenario(onboardingEvents, () => {
      state = { connected: false, knownExtra: 0, streak: 0, learning: [], known: [], plans: [], skills: zeroSkills() };
    });
  }
  $('playOnboard').addEventListener('click', playOnboard);

  /* ------- scenario: voice lesson ------- */
  function bumpWord(es, p) {
    const w = state.learning.find(x => x.es === es);
    if (!w) return;
    w.p = p;
    if (p >= 3) {
      state.learning = state.learning.filter(x => x.es !== es);
      state.known.unshift(w);
    }
    skRefresh(); renderSkillSide();
    flash(document.querySelector('#skillSide .wordlist li[data-word="' + es + '"]'));
  }

  function completeNext() {
    const p = curPlan();
    const l = nextLesson();
    if (!p || !l) return;
    l.done = true;
    l.log = ['story gist: perfect', 'conversation: 2 self-corrections', '“encuesta” recalled once — one more to go'];
    state.streak += 1;
    state.skills.speaking.pct = Math.min(100, state.skills.speaking.pct + 4);
    state.skills.listening.pct = Math.min(100, state.skills.listening.pct + 3);
    state.skills.vocab.pct = Math.min(100, state.skills.vocab.pct + 1);
    skRefresh(); renderSkillSide();
    plBuild(); renderPlanSide();
    flashSkill('speaking'); flashSkill('listening');
  }

  const lessonEvents = [
    { t: 'sys',  text: 'VOICE MODE · PROFILE LINKED', d: 1400 },
    { t: 'user', text: '&ldquo;Start my next Spanish lesson.&rdquo;', d: 1800 },
    { t: 'tool', name: 'get_next_lesson', args: '→ Lesson 3 · News in conversation (~15 min)\n→ note from lesson 2: "encuesta was shaky"', d: 2400 },
    { t: 'ai',   text: 'Lesson three. Warm-up first — repeat after me: <span class="es">la noticia… el titular… la encuesta.</span>', d: 2800 },
    { t: 'user', text: '&ldquo;La noticia… el titular… la encuesta.&rdquo;', d: 2200 },
    { t: 'ai',   text: 'A tiny story: <span class="es">&ldquo;El titular decía: huelga de trenes. Según la encuesta, el gobierno perdía apoyo…&rdquo;</span> — what was the headline about?', d: 3200 },
    { t: 'user', text: '&ldquo;¡La huelga de trenes!&rdquo;', d: 1800 },
    { t: 'ai',   text: 'Perfecto. Your turn — <span class="es">¿qué noticia leíste tú esta semana?</span>', d: 2400 },
    { t: 'user', text: '&ldquo;Eh… leí una noticia sobre una encuesta del gobierno.&rdquo;', d: 2400 },
    { t: 'ai',   text: 'Great sentence. Flashcards to close — how do you say <em>&ldquo;headline&rdquo;</em>?', d: 2400 },
    { t: 'user', text: '&ldquo;¡El titular!&rdquo;', d: 1600 },
    { t: 'tool', name: 'update_word_strength', args: '{ "la noticia": 3, "el titular": 2,\n  "la encuesta": 1 }', fx: '"la noticia" graduated to mastered',
      run: () => { bumpWord('la encuesta', 1); bumpWord('el titular', 2); bumpWord('la noticia', 3); flashSkill('vocab'); }, d: 2600 },
    { t: 'tool', name: 'complete_lesson', args: '{ lesson: 3, note: "encuesta still shaky —\n  repeat tomorrow", skills: { speaking: +4,\n  listening: +3 } }', fx: 'lesson done · streak +1 · maps updated',
      run: completeNext, d: 2400 },
    { t: 'ai',   text: 'That&rsquo;s the session — <span class="es">la noticia</span> just graduated, and your speaking node ticked up. Same time tomorrow for slang?', d: 2600 },
    { t: 'sys',  text: 'SESSION SYNCED — THE SCORE IS KEPT BEHIND ME', d: 1200 }
  ];

  function playLesson() {
    if (!curPlan() || !nextLesson()) state = deepCopy(DEFAULT);
    runScenario(lessonEvents, null);
  }
  $('playLesson').addEventListener('click', playLesson);

  /* ================= init ================= */
  renderAll();
  reveal(document.querySelector('section.active'));
  requestAnimationFrame(() => SK.start());
})();
</script>
