<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Open Language Teacher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg:#EDF0F5; --card:#FFFFFF; --ink:#17203A; --navy:#1E2B4D; --navy-ink:#FFFFFF;
    --muted:#66708A; --faint:#9AA3B8; --line:#E3E7EF; --blue:#2E63E7; --coral:#DA6A4C;
    --chip:#F1F4F9; --glow:rgba(46,99,231,.14);
    --shadow:0 1px 2px rgba(23,32,58,.04), 0 14px 40px rgba(23,32,58,.08);
    --sans:'Nunito Sans','Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --gridc:color-mix(in srgb, var(--faint) 11%, transparent);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#12151C; --card:#1B2029; --ink:#E8EBF3; --navy:#E8EBF3; --navy-ink:#141A2B;
      --muted:#97A1B8; --faint:#67718C; --line:#2A3140; --blue:#7FA3F2; --coral:#E98F72;
      --chip:#232A38; --glow:rgba(127,163,242,.12);
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 40px rgba(0,0,0,.45);
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--ink); font-family:var(--sans);
    background-image:radial-gradient(var(--gridc) 1.5px, transparent 1.5px); background-size:26px 26px;
  }
  .card {
    width:min(380px, calc(100vw - 32px)); background:var(--card); border-radius:24px;
    box-shadow:var(--shadow); padding:34px 32px 30px;
  }
  .brand { display:flex; align-items:center; gap:10px; font-weight:900; font-size:16px; margin-bottom:22px; }
  .mark { width:20px; height:20px; border-radius:50%; border:2.5px solid var(--blue); display:grid; place-items:center; }
  .mark::after { content:""; width:7px; height:7px; border-radius:50%; background:var(--blue); }
  h1 { margin:0 0 4px; font-size:24px; font-weight:900; letter-spacing:-.01em; }
  p.sub { margin:0 0 22px; color:var(--muted); font-size:13.5px; }
  label { display:block; font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; }
  input {
    width:100%; border:1.5px solid var(--line); border-radius:12px; background:var(--chip);
    padding:11px 14px; font-family:var(--sans); font-size:15px; font-weight:600; color:var(--ink); outline:none;
    transition:border-color .2s, box-shadow .2s;
  }
  input:focus { border-color:var(--blue); box-shadow:0 0 0 3px var(--glow); }
  button {
    width:100%; margin-top:22px; border:0; border-radius:999px; cursor:pointer;
    background:var(--navy); color:var(--navy-ink); font-family:var(--sans);
    font-size:15px; font-weight:800; padding:13px;
    transition:transform .15s, filter .2s;
  }
  button:hover { transform:translateY(-1px); filter:brightness(1.1); }
  .err { margin-top:14px; min-height:18px; font-size:13px; font-weight:700; color:var(--coral); }
  .foot { margin-top:18px; font-size:12px; color:var(--faint); text-align:center; }
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="brand"><span class="mark"></span>Open Language Teacher</div>
    <h1>Sign in</h1>
    <p class="sub">Your data lives here. Your own AI does the teaching.</p>
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" autofocus required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
    <div class="foot">Accounts are created by your administrator.</div>
  </form>
<script>
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const err = document.getElementById('err');
    err.textContent = '';
    try {
      const r = await fetch('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value })
      });
      const d = await r.json();
      if (!r.ok) { err.textContent = d.error || 'Sign-in failed.'; return; }
      location.href = d.role === 'admin' ? '/admin' : '/';
    } catch { err.textContent = 'Network error — try again.'; }
  });
</script>
</body>
</html>
