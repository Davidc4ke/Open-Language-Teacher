<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accounts · Open Language Teacher</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800;6..12,900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg:#EDF0F5; --card:#FFFFFF; --ink:#17203A; --navy:#1E2B4D; --navy-ink:#FFFFFF;
    --muted:#66708A; --faint:#9AA3B8; --line:#E3E7EF; --blue:#2E63E7; --green:#35935B;
    --coral:#DA6A4C; --chip:#F1F4F9; --glow:rgba(46,99,231,.14);
    --shadow:0 1px 2px rgba(23,32,58,.04), 0 14px 40px rgba(23,32,58,.08);
    --sans:'Nunito Sans','Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --gridc:color-mix(in srgb, var(--faint) 11%, transparent);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#12151C; --card:#1B2029; --ink:#E8EBF3; --navy:#E8EBF3; --navy-ink:#141A2B;
      --muted:#97A1B8; --faint:#67718C; --line:#2A3140; --blue:#7FA3F2; --green:#6FC28F;
      --coral:#E98F72; --chip:#232A38; --glow:rgba(127,163,242,.12);
      --shadow:0 1px 2px rgba(0,0,0,.35), 0 14px 40px rgba(0,0,0,.45);
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px;
    background-image:radial-gradient(var(--gridc) 1.5px, transparent 1.5px); background-size:26px 26px;
  }
  .topbar {
    position:sticky; top:0; z-index:10; margin:14px max(16px, calc((100% - 900px)/2)) 0;
    background:var(--card); border-radius:999px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:12px; padding:10px 12px 10px 18px;
  }
  .brand { display:flex; align-items:center; gap:9px; font-weight:900; font-size:15px; }
  .mark { width:18px; height:18px; border-radius:50%; border:2.5px solid var(--blue); display:grid; place-items:center; }
  .mark::after { content:""; width:6px; height:6px; border-radius:50%; background:var(--blue); }
  .tag { font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; background:var(--chip); color:var(--muted); border-radius:999px; padding:4px 12px; }
  .spacer { flex:1; }
  .quiet { border:0; background:none; cursor:pointer; color:var(--muted); font-family:var(--sans); font-weight:800; font-size:13px; border-radius:999px; padding:8px 14px; }
  .quiet:hover { background:var(--chip); color:var(--ink); }
  main { max-width:900px; margin:0 auto; padding:26px 16px 60px; }
  h1 { font-size:26px; font-weight:900; letter-spacing:-.01em; margin:6px 0 18px; }
  .card { background:var(--card); border-radius:20px; box-shadow:var(--shadow); }
  .pad { padding:20px 22px; }
  .grid { display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:10px; align-items:end; }
  label { display:block; font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  input {
    width:100%; border:1.5px solid var(--line); border-radius:10px; background:var(--chip);
    padding:9px 12px; font-family:var(--sans); font-size:14px; font-weight:600; color:var(--ink); outline:none;
  }
  input:focus { border-color:var(--blue); box-shadow:0 0 0 3px var(--glow); }
  .btn { border:0; border-radius:999px; cursor:pointer; background:var(--navy); color:var(--navy-ink); font-family:var(--sans); font-size:14px; font-weight:800; padding:10px 20px; }
  .btn:hover { filter:brightness(1.1); }
  .err { min-height:18px; margin-top:10px; font-size:13px; font-weight:700; color:var(--coral); }
  .ok { color:var(--green); }
  table { width:100%; border-collapse:collapse; margin-top:6px; }
  th { text-align:left; font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); padding:10px 10px; border-bottom:1.5px solid var(--line); }
  td { padding:12px 10px; border-bottom:1px solid var(--line); font-size:14px; }
  tr:last-child td { border-bottom:0; }
  td b { font-weight:800; }
  td small { display:block; color:var(--faint); font-size:12px; }
  code { font-family:var(--mono); font-size:11.5px; background:var(--chip); border-radius:8px; padding:3px 8px; }
  .pill { display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:800; border-radius:999px; padding:3px 10px; }
  .pill.on { background:color-mix(in srgb, var(--green) 14%, transparent); color:var(--green); }
  .pill.off { background:var(--chip); color:var(--faint); }
  .del { border:0; background:none; cursor:pointer; color:var(--faint); font-size:13px; border-radius:8px; padding:4px 8px; }
  .del:hover { color:var(--coral); background:var(--chip); }
  .mt { margin-top:18px; }
  @media (max-width:720px) { .grid { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="mark"></span>Open Language Teacher</div>
    <span class="tag">Admin</span>
    <div class="spacer"></div>
    <button class="quiet" id="logout">Sign out</button>
  </div>
  <main>
    <h1>Accounts</h1>

    <form class="card pad" id="add">
      <div class="grid">
        <div><label>Name</label><input id="a-name" placeholder="e.g. David" required></div>
        <div><label>Username</label><input id="a-user" placeholder="e.g. david" required></div>
        <div><label>Password</label><input id="a-pass" placeholder="min. 8 characters" required></div>
        <button class="btn" type="submit">Add account</button>
      </div>
      <div class="err" id="add-msg"></div>
    </form>

    <div class="card mt">
      <table>
        <thead><tr><th>Account</th><th>Pair code</th><th>MCP endpoint</th><th>AI sync</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
<script>
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  async function load() {
    const r = await fetch('/api/admin/users', { cache: 'no-store' });
    if (r.status === 401 || r.status === 403) { location.href = '/login'; return; }
    const users = await r.json();
    document.getElementById('rows').innerHTML = users.map(u => `
      <tr>
        <td><b>${esc(u.name)}</b><small>${esc(u.username)}${u.role === 'admin' ? ' · admin' : ''}</small></td>
        <td>${u.pair_code ? '<code>' + esc(u.pair_code) + '</code>' : '—'}</td>
        <td>${u.mcpUrl ? '<code style="font-size:10px">' + esc(u.mcpUrl) + '</code>' : '—'}</td>
        <td>${u.role === 'admin' ? '—' : (u.synced ? '<span class="pill on">● synced</span>' : '<span class="pill off">○ waiting</span>')}</td>
        <td>${u.role === 'admin' ? '' : '<button class="del" data-id="' + u.id + '" title="Delete account">✕</button>'}</td>
      </tr>`).join('');
  }
  document.getElementById('add').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('add-msg');
    msg.className = 'err'; msg.textContent = '';
    const body = {
      name: document.getElementById('a-name').value,
      username: document.getElementById('a-user').value,
      password: document.getElementById('a-pass').value
    };
    const r = await fetch('/api/admin/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    if (!r.ok) { msg.textContent = d.error || 'Failed.'; return; }
    msg.className = 'err ok';
    msg.textContent = 'Created ' + d.username + ' — pair code ' + d.pair_code + '. They can sign in now.';
    e.target.reset(); load();
  });
  document.getElementById('rows').addEventListener('click', async (e) => {
    const b = e.target.closest('.del');
    if (!b) return;
    if (!confirm('Delete this account and all its data?')) return;
    await fetch('/api/admin/users/' + b.dataset.id, { method: 'DELETE' });
    load();
  });
  document.getElementById('logout').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' }); location.href = '/login';
  });
  load(); setInterval(load, 5000);
</script>
</body>
</html>
