<div id="root"></div>
<script>
const ICON = {
  walk:'<path d="M4 5a2 2 0 0 1 2-2h5v18H6a2 2 0 0 1-2-2z"/><path d="M20 5a2 2 0 0 0-2-2h-5v18h5a2 2 0 0 0 2-2z"/>',
  speak:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  story:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h6M7 12h6M7 15h4"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'
};
const pic = k => '<svg viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block">' + (ICON[k] || ICON.story) + '</svg>';
const OPEN = { walk: 'Open part 1, the walk.', speak: 'Start part 2, the speaking.', story: 'Open part 3, the reading.' };

function render() {
  const parts = D.parts || [];
  const done = D.doneParts || [];
  document.getElementById('root').innerHTML =
    '<h1>' + esc(D.title || 'Today') + '</h1>' +
    '<span class="meta">lesson ' + (D.n || 1) + (D.of ? ' of ' + D.of : '') + ' · ~' + (D.mins || 10) + ' min · in order</span>' +
    '<div class="list">' + parts.map((p, i) => {
      const fin = done.indexOf(i) >= 0, open = i === 0 || done.indexOf(i - 1) >= 0;
      return '<button class="tile' + (fin ? ' done' : open ? '' : ' lock') + '" data-part="' + i + '"' + (fin || open ? '' : ' disabled') + '>' +
        '<span style="color:var(--' + (fin ? 'green' : open ? 'blue' : 'faint') + ');flex:none;margin-top:1px">' + pic(fin || open ? p.kind : 'lock') + '</span>' +
        '<div><b>' + (i + 1) + ' · ' + esc(p.name) + '</b>' + esc(p.d || '') + '</div>' +
        '<span class="mn">' + (fin ? 'DONE ✓' : open ? (p.min || 2) + ' MIN' : 'AFTER PART ' + i) + '</span></button>';
    }).join('') + '</div>' +
    (D.obj ? '<p class="note">' + esc(D.obj) + '</p>' : '');
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-part]');
  if (!t || t.disabled || t.classList.contains('lock')) return;
  const i = +t.dataset.part, p = (D.parts || [])[i] || {};
  callTool('save_lesson_progress', { lesson: D.n, note: 'Opened part ' + (i + 1) + ': ' + (p.name || '') });
  followUp(OPEN[p.kind] || ('Open part ' + (i + 1) + '.'));
});
render();
</script>
